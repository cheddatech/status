# Upptime config for CheddaBoards status
# Docs: https://upptime.js.org/docs/configuration

owner: cheddatech
repo: status

sites:
  - name: API
    url: https://api.cheddaboards.com/health

  - name: Leaderboards (on-chain)
    url: https://fdvph-sqaaa-aaaap-qqc4a-cai.raw.icp0.io/games/test-game/scoreboards/all-time?limit=1

  - name: Website
    url: https://cheddaboards.com

  - name: Docs
    url: https://docs.cheddaboards.com

  # Uncomment once The Standard is live on its canister
  # - name: The Standard
  #   url: https://standard.cheddatech.com

status-website:
  cname: status.cheddatech.com
  name: CheddaBoards Status
  theme: dark
  logoUrl: https://status.cheddatech.com/logo.png
  favicon: https://status.cheddatech.com/favicon.png
  hideNavTitle: true
  introTitle: "CheddaBoards status"
  introMessage: "Checked every few minutes from outside our own infrastructure. The API handles sign-in and score submission. Leaderboards are read straight from the chain, so they can stay up even when the API is down."
  navbar:
    - title: Status
      href: /
    - title: ICP network
      href: https://status.internetcomputer.org
    - title: Docs
      href: https://docs.cheddaboards.com
    - title: CheddaBoards
      href: https://cheddaboards.com
  customHeadHtml: |
    <style>
      :root {
        --body-background-color: #0a0a0a !important;
        --body-text-color: #e8e8e8 !important;
        --card-background-color: #111111 !important;
        --card-border-color: #1e1e1e !important;
        --nav-background-color: #0a0a0a !important;
        --nav-border-bottom-color: #1e1e1e !important;
        --nav-current-border-bottom-color: #ffd700 !important;
      }
      a { color: #ffd700; }
      a:hover { color: #ffe44d; }
      h1, h2 { color: #ffd700; letter-spacing: -0.01em; }
      nav img { height: 2.5rem !important; border-radius: 0 !important; }
      img[src*="graphs/"] {
        filter: grayscale(1) sepia(1) saturate(4) hue-rotate(5deg) brightness(0.85);
        opacity: 0.55;
      }
      @media (max-width: 700px) {
        img[src*="graphs/"] { opacity: 0.15; }
      }
    </style>
